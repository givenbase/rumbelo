name: 🧪 Rumbelo CI - E2E Smoke Tests

# Staging only — never production.
# Domains come from GitHub Environment `staging` vars.
# Demo account passwords stay as environment secrets (optional; defaults match seed).

on:
  workflow_dispatch:
  # Enable when a `dev` branch exists and staging is always up:
  # push:
  #   branches: [dev]
  #   paths:
  #     - 'apps/e2e/**'
  #     - 'apps/application/**'
  #     - 'apps/backend/**'
  #     - 'packages/contracts/**'
  #     - '.github/workflows/e2e-smoke.yml'

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-staging:
    name: Playwright smoke — staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging

    steps:
      - name: Guard — staging domains configured
        if: ${{ vars.DOMAIN_APP == '' || vars.DOMAIN_BACK == '' }}
        run: |
          echo "::error::Staging vars DOMAIN_APP and DOMAIN_BACK must be set (GitHub Environment → staging)."
          exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @rumbelo/e2e install:browsers

      - name: Write E2E env
        working-directory: apps/e2e
        env:
          DOMAIN_APP: ${{ vars.DOMAIN_APP }}
          DOMAIN_BACK: ${{ vars.DOMAIN_BACK }}
          E2E_BASIC_EMAIL: ${{ secrets.E2E_BASIC_EMAIL }}
          E2E_BASIC_PASSWORD: ${{ secrets.E2E_BASIC_PASSWORD }}
          E2E_PLUS_EMAIL: ${{ secrets.E2E_PLUS_EMAIL }}
          E2E_PLUS_PASSWORD: ${{ secrets.E2E_PLUS_PASSWORD }}
          E2E_MAX_EMAIL: ${{ secrets.E2E_MAX_EMAIL }}
          E2E_MAX_PASSWORD: ${{ secrets.E2E_MAX_PASSWORD }}
        run: |
          cat > .env <<EOF
          APP_URL=${DOMAIN_APP}
          BACKEND_URL=${DOMAIN_BACK}
          E2E_BASIC_EMAIL=${E2E_BASIC_EMAIL:-basic@rumbelo.com}
          E2E_BASIC_PASSWORD=${E2E_BASIC_PASSWORD:-RumbeloDemo1!}
          E2E_PLUS_EMAIL=${E2E_PLUS_EMAIL:-plus@rumbelo.com}
          E2E_PLUS_PASSWORD=${E2E_PLUS_PASSWORD:-RumbeloDemo1!}
          E2E_MAX_EMAIL=${E2E_MAX_EMAIL:-max@rumbelo.com}
          E2E_MAX_PASSWORD=${E2E_MAX_PASSWORD:-RumbeloDemo1!}
          EOF

      - name: Run smoke tests
        run: pnpm test:e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
